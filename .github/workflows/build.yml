name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Koka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o "$env:TEMP\install-koka.bat" https://github.com/koka-lang/koka/releases/latest/download/install.bat
          & "$env:TEMP\install-koka.bat"
          "$env:LOCALAPPDATA\koka\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install Hica (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cladam.github.io/hica/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Hica (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to v0.49.6 — v0.49.14 has a Windows build regression
          $url = "https://github.com/cladam/hica/releases/download/v0.49.6/hica-windows-x86_64.zip"
          curl -fsSL -o "$env:TEMP\hica.zip" $url
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\hica" | Out-Null
          Expand-Archive -Path "$env:TEMP\hica.zip" -DestinationPath "$env:LOCALAPPDATA\hica" -Force
          "$env:LOCALAPPDATA\hica" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Verify tools
        run: |
          koka --version
          hica --version
        shell: bash

      - name: Run tests
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          set +e
          for f in src/*.hc; do
            name=$(basename "$f")
            [[ "$name" == "lisp.hc" || "$name" == "main.hc" ]] && continue
            result=$(hica test "$f" 2>&1 | grep -E "passed|failed|error")
            echo "$name: $result"
          done

      - name: Build hilisp binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: hica build -o hilisp

      - name: Build hilisp binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: hica build -o hilisp

      - name: Run prelude tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output=$(./hilisp lib/prelude.hl lib/test-prelude.hl)
          echo "$output"
          echo "$output" | grep -q "^failed: 0" \
            || { echo "::error::Prelude tests failed — see output above"; exit 1; }

      - name: Run prelude tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\hilisp.exe lib\prelude.hl lib\test-prelude.hl
          Write-Output $output
          if (-not ($output -match '(?m)^failed: 0')) {
            Write-Output '::error::Prelude tests failed — see output above'
            exit 1
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
